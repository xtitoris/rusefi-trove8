    class: analog_inputs
# PC2 - CLT (4.7k bias + 2:1 divider)
    ts_name: CLT (C2)

  - id: EFI_ADC_13
    class: analog_inputs
# PC3 - IAT (4.7k bias + 2:1 divider)
    ts_name: IAT (C3)

