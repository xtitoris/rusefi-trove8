# Interactive pinout for the trove8 main input connector J1 (Delphi Sicma 24,
# black connector in connector.png).
pins:
  - pin: A1
    ts_name: Digital Input 3 (E14)
    type: din
    function: Digital input 3 (conditioned, spare)

  - pin: A2
    ts_name: Crank Input (E12)
    type: din
    function: Crank position sensor (conditioned digital input)

  - pin: A3
    ts_name: TPS1 (A4)
    type: at
    function: TPS 1 signal

  - pin: A4
    ts_name: Analog Inputs 3 (A3)
    type: at
    function: Throttle pedal position 1 signal (PPS1, not configured)

  - pin: A5
    ts_name: MAP (C0)
    type: at
    function: MAP sensor signal

  - pin: A6
    ts_name: Analog Inputs 1 (A1)
    type: at
    function: Oxygen sensor 1 signal (narrowband)

  - pin: A7
    ts_name: CLT (C2)
    type: at
    function: Coolant temperature sensor

  - pin: A8
    type: 5V
    function: Sensor supply +5V (via F11 ferrite)

  - pin: B1
    ts_name: Digital Input 4 (E15)
    type: din
    function: Digital input 4 (conditioned, spare)

  - pin: B2
    ts_name: Cam Input (E13)
    type: din
    function: Cam position sensor (conditioned digital input)

  - pin: B3
    ts_name: TPS1 Secondary (B0)
    type: at
    function: TPS 2 signal (secondary)

  - pin: B4
    ts_name: Analog Inputs 14 (C4)
    type: at
    function: Throttle pedal position 2 signal (PPS2, not configured)

  - pin: B5
    ts_name: Analog Inputs 7 (A7)
    type: at
    function: AC clutch request input (not configured)

  - pin: B6
    ts_name: Analog Inputs 0 (A0)
    type: at
    function: Oxygen sensor 2 signal (narrowband)

  - pin: B7
    ts_name: IAT (C3)
    type: at
    function: Intake air temperature sensor

  - pin: B8
    type: sgnd
    function: Sensor ground (analog GNDA)

  - pin: C1
    type: 12v
    function: Battery +12V switched (ignition)

  - pin: C2
    type: 12v
    function: Battery +12V permanent

  - pin: C3
    type: pgnd
    function: Power ground

  - pin: C4
    ts_name: Knock 1 (A2)
    type: at
    function: Knock sensor 1 signal

  - pin: C5
    ts_name: Knock 2 (C1)
    type: at
    function: Knock sensor 2 signal

  - pin: C6
    type: can
    function: CAN bus low

  - pin: C7
    type: can
    function: CAN bus high

  - pin: C8
    type: pgnd
    function: Power ground

